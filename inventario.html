:root{

}
html{scroll-behavior:smooth;}
body{font-family:'Open Sans',sans-serif;background:#ffffff;color:#1a1510;overflow-x:hidden;}

/* HEADER */
header{background:rgba(0,0,0,0.97);display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:92px;position:sticky;top:0;z-index:1000;border-bottom:1px solid rgba(214,106,17,0.35);}

.f-btn{background:#ffffff;border:1px solid #ddd6c8;color:#555;padding:10px 18px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;letter-spacing:1px;text-transform:uppercase;}

/* GRID */

.car-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center center;transition:transform 0.4s;display:block;}

.cbadge{position:absolute;top:12px;left:12px;font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;padding:4px 10px;letter-spacing:1px;text-transform:uppercase;color:#fff;}
.cbadge.blindado{background:var(--naranja);}

.car-info{padding:16px;}

.modal{background:#fff;min-height:100vh;width:100%;max-width:100%;display:grid;grid-template-columns:55% 45%;position:relative;overflow-x:hidden;}

.modal-gallery-main{width:100%;height:75vh;position:relative;flex-shrink:0;overflow:hidden;}

.mbtn-close:hover{border-color:#ccc;color:#555;}
.zoom-overlay{display:none;position:fixed;inset:0;background:#000;z-index:9999;align-items:center;justify-content:center;}
.zoom-overlay.open{display:flex;}
.zoom-overlay img{max-width:100vw;max-height:100vh;object-fit:contain;display:block;touch-action:none;}
.zoom-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.1);border:none;color:#fff;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.zoom-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);border:none;color:#fff;width:48px;height:48px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;}

  .gallery-thumbs{padding:8px 12px;}

}
@media(max-width:480px){

function renderizar(){
  const grid = document.getElementById('cars-grid');
  const count = document.getElementById('count');
  const orden = {blindado:0, exclusivo:1, clasico:2};
  const lista = INVENTARIO.filter(c => {
    const catOk = catActual === 'todos' || c.cat === catActual;
    const busOk = c.titulo.toLowerCase().includes(busquedaActual.toLowerCase());
    return catOk && busOk;
  }).sort((a,b) => (orden[a.cat] ?? 9) - (orden[b.cat] ?? 9));
  count.textContent = lista.length + ' vehículo' + (lista.length !== 1 ? 's' : '');
  if(!lista.length){
    grid.innerHTML = `<div class="no-results"><i class="fas fa-car"></i><p>No se encontraron vehículos</p></div>`;
    return;
  }
  grid.innerHTML = lista.map((c,i) => {
    const idx = INVENTARIO.indexOf(c);
    const s = c.specs.slice(0,3).map(sp=>`<span class="stag">${sp.v}</span>`).join('');
    return `<div class="car-card" onclick="abrir(${idx})">
      <div class="car-img-wrap">
        <img src="${c.img || ('img/' + c.carpeta + '/' + c.imgs[0])}" alt="${c.titulo}" loading="lazy">
        <span class="cbadge ${c.cat}">${c.badge}</span>
      </div>
      <div class="car-info">
        <h3>${c.titulo}</h3>
        <div class="car-meta"><span><i class="fas fa-calendar-alt"></i>${c.anio}</span><span><i class="fas fa-tachometer-alt"></i>${c.km}</span></div>
        <div class="car-specs-row">${s}</div>
        <button class="btn-card" onclick="event.stopPropagation();abrir(${idx})">Ver Ficha</button>
      </div>
    </div>`;
  }).join('');
}

function filtrar(cat, btn){
  catActual = cat;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderizar();
}

function buscar(val){
  busquedaActual = val;
  if(val.length > 0 && catActual !== 'todos'){
    catActual = 'todos';
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.f-btn')[0].classList.add('active');
  }
  renderizar();
}

let gFotos = [];
let gIdx = 0;

function irFoto(idx){
  gIdx = idx;
  document.getElementById('m-img').src = gFotos[idx];
  document.querySelectorAll('.gallery-thumb').forEach((t,i) => t.classList.toggle('active', i === idx));
}

function cambiarFoto(dir){
  irFoto((gIdx + dir + gFotos.length) % gFotos.length);
}

function abrir(i){
  const c = INVENTARIO[i];
  const carpeta = c.carpeta ? 'img/' + c.carpeta + '/' : 'img/';
  gFotos = (c.imgs || [c.img]).map(f => f.startsWith('img/') ? f : carpeta + f);
  gIdx = Math.max(0, gFotos.indexOf(c.img));
  document.getElementById('m-img').src = c.img;
  document.getElementById('m-img').alt = c.titulo;
  const thumbs = document.getElementById('m-thumbs');
  thumbs.innerHTML = gFotos.map((f,i) => `<img class="gallery-thumb${i===gIdx?' active':''}" src="${f}" loading="lazy" onclick="irFoto(${i})">`).join('');
  const arrows = document.querySelectorAll('.gallery-arrow');
  arrows.forEach(a => a.classList.toggle('hidden', gFotos.length <= 1));
  document.getElementById('m-titulo').textContent = c.titulo;
  document.getElementById('m-sub').textContent = c.anio + ' · ' + c.km + ' · ' + c.badge;
  const mPrecio = document.getElementById('m-precio'); if(mPrecio) mPrecio.innerHTML = c.precio + ' <small>MXN</small>';
  const badge = document.getElementById('m-badge');
  badge.textContent = c.badge;
  badge.className = 'modal-badge-luxury ' + c.cat;
  document.getElementById('m-specs').innerHTML = c.specs.map(s=>`<div class="mspec"><span class="sl">${s.l}</span><span class="sv">${s.v}</span></div>`).join('');
  document.getElementById('m-wa').href = `https://wa.me/${WA_NUM}?text=${encodeURIComponent(c.wa)}`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrar(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function abrirZoom(){
  document.getElementById('zoom-img').src = gFotos[gIdx];
  document.getElementById('zoom-overlay').classList.add('open');
}
function cerrarZoom(){
  document.getElementById('zoom-overlay').classList.remove('open');
}
function cambiarZoom(dir){
  gIdx = (gIdx + dir + gFotos.length) % gFotos.length;
  document.getElementById('zoom-img').src = gFotos[gIdx];
  document.querySelectorAll('.gallery-thumb').forEach((t,i) => t.classList.toggle('active', i === gIdx));
}

// Swipe táctil en modal gallery
let tsX = 0;
document.addEventListener('DOMContentLoaded', () => {
  const galeria = document.querySelector('.modal-gallery-main');
  galeria.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; }, {passive:true});
  galeria.addEventListener('touchend', e => {
    const diff = tsX - e.changedTouches[0].clientX;
    if(Math.abs(diff) > 40) cambiarFoto(diff > 0 ? 1 : -1);
  }, {passive:true});

  // Swipe táctil en zoom
  const zoom = document.getElementById('zoom-overlay');
  let tzX = 0, tzY = 0;
  zoom.addEventListener('touchstart', e => { tzX = e.touches[0].clientX; tzY = e.touches[0].clientY; }, {passive:true});
  zoom.addEventListener('touchend', e => {
    const dx = tzX - e.changedTouches[0].clientX;
    const dy = tzY - e.changedTouches[0].clientY;
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
      cambiarZoom(dx > 0 ? 1 : -1);
    } else if(Math.abs(dx) < 10 && Math.abs(dy) < 10){
      cerrarZoom();
    }
  }, {passive:true});
});

function cerrarFuera(e){
  if(e.target.id === 'overlay') cerrar();
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });

// Leer bÃºsqueda desde URL (?q=...)
const urlParams = new URLSearchParams(window.location.search);
const qParam = urlParams.get('q');
const catParam = urlParams.get('cat');
if(qParam){
  busquedaActual = qParam;
  const si = document.getElementById('search-input');
  if(si) si.value = qParam;
}
if(catParam){
  catActual = catParam;
  document.querySelectorAll('.f-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === catParam);
  });
}
renderizar();
</script>
