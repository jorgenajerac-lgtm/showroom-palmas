<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --naranja:#D66A11;
  --naranja-dark:#a87018;
  --negro:#050505;
  --oro:#D66A11;
}
html{scroll-behavior:smooth;}
body{font-family:'Open Sans',sans-serif;background:#ffffff;color:#1a1510;overflow-x:hidden;}

/* HEADER */
header{background:rgba(0,0,0,0.97);display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:92px;position:sticky;top:0;z-index:1000;border-bottom:1px solid rgba(214,106,17,0.35);}
.logo-wrap{display:flex;align-items:center;}
.logo-wrap img{height:76px;width:auto;max-width:300px;display:block;opacity:0;transform:translateY(-10px);animation:logoIn 0.7s ease forwards;}
@keyframes logoIn{to{opacity:1;transform:translateY(0);}}
.header-back{display:flex;align-items:center;gap:8px;color:#ccc;text-decoration:none;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;transition:color 0.2s;}
.header-back:hover{color:var(--naranja);}

/* HERO INVENTARIO */
.inv-hero{background:var(--negro);padding:48px 48px 36px;border-bottom:1px solid #1a1a1a;}
.inv-hero h1{font-family:'Montserrat',sans-serif;color:#fff;font-size:36px;font-weight:900;text-transform:uppercase;margin-bottom:6px;}
.inv-hero h1 span{color:var(--naranja);}
.inv-hero p{color:#888;font-size:14px;}

/* FILTROS */
.filtros-wrap{background:#fff;padding:20px 48px;border-bottom:1px solid #e8e2d8;position:sticky;top:92px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.filtros-inner{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.search-wrap{flex:1;min-width:220px;max-width:340px;position:relative;}
.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#999;font-size:13px;}
.search-wrap input{width:100%;padding:10px 16px 10px 38px;border:1px solid #ddd6c8;background:#ffffff;color:#1a1510;font-size:13px;outline:none;font-family:'Open Sans',sans-serif;transition:border 0.2s;}
.search-wrap input:focus{border-color:var(--naranja);}
.search-wrap input::placeholder{color:#aaa;}
.f-btn{background:#ffffff;border:1px solid #ddd6c8;color:#555;padding:10px 18px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;letter-spacing:1px;text-transform:uppercase;}
.f-btn:hover,.f-btn.active{background:var(--naranja);color:#fff;border-color:var(--naranja);}
.resultado-count{margin-left:auto;font-family:'Montserrat',sans-serif;font-size:12px;color:#888;white-space:nowrap;}

/* GRID */
.inv-body{padding:40px 48px 80px;}
.cars-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.car-card{background:#fff;border:1px solid #e8e2d8;overflow:hidden;transition:all 0.25s;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.car-card:hover{transform:translateY(-4px);border-color:rgba(214,106,17,0.5);box-shadow:0 12px 40px rgba(0,0,0,0.12);}
.car-img-wrap{position:relative;overflow:hidden;height:190px;background:#ede8df;}
.car-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s;display:block;}
.car-card:hover .car-img-wrap img{transform:scale(1.05);}
.cbadge{position:absolute;top:12px;left:12px;font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;padding:4px 10px;letter-spacing:1px;text-transform:uppercase;color:#fff;}
.cbadge.blindado{background:var(--naranja);}
.cbadge.exclusivo{background:#1a1a8c;}
.cbadge.clasico{background:#2c6e49;}
.car-info{padding:16px;}
.car-info h3{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;color:#1a1510;margin-bottom:4px;}
.car-meta{color:#999;font-size:11px;margin-bottom:10px;letter-spacing:0.5px;}
.car-meta span{margin-right:10px;}
.car-meta i{margin-right:3px;color:#ccc;}
.car-specs-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.stag{background:#f0ebe2;color:#777;font-size:10px;font-weight:600;padding:3px 8px;font-family:'Montserrat',sans-serif;border:1px solid #e0d8cc;}
.car-price{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:#1a1510;margin-bottom:12px;}
.car-price small{font-size:11px;color:#999;font-weight:400;margin-left:4px;}
.btn-card{display:block;width:100%;text-align:center;background:#1a1510;color:#fff;padding:10px;border:none;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;transition:all 0.2s;cursor:pointer;}
.btn-card:hover{background:var(--naranja);color:#fff;}
.no-results{grid-column:1/-1;text-align:center;padding:80px 20px;color:#999;font-family:'Montserrat',sans-serif;}
.no-results i{font-size:48px;color:#ddd;display:block;margin-bottom:16px;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:2000;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:#0d0d0d;max-width:820px;width:100%;max-height:90vh;overflow-y:auto;position:relative;display:grid;grid-template-columns:1fr 1fr;}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,0.7);border:none;color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;z-index:10;}
.modal-gallery{position:relative;overflow:hidden;min-height:320px;background:#111;display:flex;flex-direction:column;}
.modal-gallery-main{position:relative;flex:1;min-height:280px;}
.modal-gallery-main img{width:100%;height:100%;object-fit:cover;display:block;}
.modal-gallery-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.5) 0%,transparent 60%);pointer-events:none;}
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.6);border:none;color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;z-index:5;transition:background 0.2s;}
.gallery-arrow:hover{background:rgba(214,106,17,0.85);}
.gallery-arrow.prev{left:10px;}
.gallery-arrow.next{right:10px;}
.gallery-arrow.hidden{display:none;}
.gallery-thumbs{display:flex;gap:4px;padding:6px;background:#0a0a0a;overflow-x:auto;flex-shrink:0;}
.gallery-thumbs::-webkit-scrollbar{height:3px;}
.gallery-thumbs::-webkit-scrollbar-thumb{background:#333;}
.gallery-thumb{width:52px;height:40px;object-fit:cover;cursor:pointer;opacity:0.5;border:2px solid transparent;flex-shrink:0;transition:all 0.15s;}
.gallery-thumb.active{opacity:1;border-color:var(--naranja);}
.zoom-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out;touch-action:pan-y;}
.zoom-overlay.open{display:flex;}
.zoom-overlay img{width:100vw;height:100vh;object-fit:contain;touch-action:none;}
.zoom-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.1);border:none;color:#fff;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.zoom-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);border:none;color:#fff;width:48px;height:48px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;}
.zoom-arrow:hover{background:rgba(214,106,17,0.85);}
.zoom-prev{left:20px;}
.zoom-next{right:20px;}
#m-img{cursor:zoom-in;}
.modal-badge-luxury{position:absolute;top:20px;left:20px;font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;padding:5px 14px;letter-spacing:2px;text-transform:uppercase;color:#fff;}
.modal-badge-luxury.blindado{background:var(--naranja);}
.modal-badge-luxury.exclusivo{background:#1a1a8c;}
.modal-badge-luxury.clasico{background:#2c6e49;}
.modal-panel{padding:32px 28px;display:flex;flex-direction:column;justify-content:space-between;background:#0d0d0d;}
.modal-eyebrow{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--naranja);margin-bottom:6px;}
.modal-title{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:900;color:#fff;text-transform:uppercase;margin-bottom:4px;}
.modal-sub{color:#888;font-size:12px;margin-bottom:12px;}
.modal-divider{border:none;border-top:1px solid #2a2a2a;margin:12px 0 16px;}
.modal-specs-title{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:10px;}
.modal-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;}
.mspec{background:#111;padding:10px 12px;}
.mspec .sl{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#555;display:block;margin-bottom:2px;}

.modal-btns{display:flex;flex-direction:column;gap:10px;}
.mbtn-wa{display:flex;align-items:center;justify-content:center;gap:10px;background:#25d366;color:#fff;padding:13px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:background 0.2s;}
.mbtn-wa:hover{background:#1ebe5d;}
.mbtn-close{background:transparent;border:1px solid #333;color:#888;padding:11px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;}
.mbtn-close:hover{border-color:#666;color:#ccc;}

/* RESPONSIVE */
@media(max-width:1024px){.cars-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:768px){
  header{padding:0 20px;}
  .inv-hero{padding:36px 20px 28px;}
  .inv-hero h1{font-size:26px;}
  .filtros-wrap{padding:14px 20px;}
  .inv-body{padding:24px 20px 60px;}
  .cars-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .modal{grid-template-columns:1fr;}
  .modal-gallery{min-height:220px;}
}
@media(max-width:480px){.cars-grid{grid-template-columns:1fr;}}
</style>

function renderizar(){
  const grid = document.getElementById('cars-grid');
  const count = document.getElementById('count');
  const orden = {blindado:0, exclusivo:1, clasico:2};
  const lista = INVENTARIO.filter(c => {
    const catOk = catActual === 'todos' || c.cat === catActual;
    const busOk = c.titulo.toLowerCase().includes(busquedaActual.toLowerCase());
    return catOk && busOk;
  }).sort((a,b) => (orden[a.cat] ?? 9) - (orden[b.cat] ?? 9));
  count.textContent = lista.length + ' vehÃ­culo' + (lista.length !== 1 ? 's' : '');
  if(!lista.length){
    grid.innerHTML = `<div class="no-results"><i class="fas fa-car"></i><p>No se encontraron vehÃ­culos</p></div>`;
    return;
  }
  grid.innerHTML = lista.map((c,i) => {
    const idx = INVENTARIO.indexOf(c);
    const s = c.specs.slice(0,3).map(sp=>`<span class="stag">${sp.v}</span>`).join('');
    return `<div class="car-card" onclick="abrir(${idx})">
      <div class="car-img-wrap">
        <img src="${c.img || ('img/' + c.carpeta + '/' + c.imgs[0])}" alt="${c.titulo}" loading="lazy">
        <span class="cbadge ${c.cat}">${c.badge}</span>
      </div>
      <div class="car-info">
        <h3>${c.titulo}</h3>
        <div class="car-meta"><span><i class="fas fa-calendar-alt"></i>${c.anio}</span><span><i class="fas fa-tachometer-alt"></i>${c.km}</span></div>
        <div class="car-specs-row">${s}</div>
        <button class="btn-card" onclick="event.stopPropagation();abrir(${idx})">Ver Ficha</button>
      </div>
    </div>`;
  }).join('');
}

function filtrar(cat, btn){
  catActual = cat;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderizar();
}

function buscar(val){
  busquedaActual = val;
  if(val.length > 0 && catActual !== 'todos'){
    catActual = 'todos';
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.f-btn')[0].classList.add('active');
  }
  renderizar();
}

let gFotos = [];
let gIdx = 0;

function irFoto(idx){
  gIdx = idx;
  document.getElementById('m-img').src = gFotos[idx];
  document.querySelectorAll('.gallery-thumb').forEach((t,i) => t.classList.toggle('active', i === idx));
}

function cambiarFoto(dir){
  irFoto((gIdx + dir + gFotos.length) % gFotos.length);
}

function abrir(i){
  const c = INVENTARIO[i];
  const carpeta = c.carpeta ? 'img/' + c.carpeta + '/' : 'img/';
  gFotos = (c.imgs || [c.img]).map(f => f.startsWith('img/') ? f : carpeta + f);
  gIdx = 0;
  document.getElementById('m-img').src = gFotos[0];
  document.getElementById('m-img').alt = c.titulo;
  const thumbs = document.getElementById('m-thumbs');
  thumbs.innerHTML = gFotos.map((f,i) => `<img class="gallery-thumb${i===0?' active':''}" src="${f}" loading="lazy" onclick="irFoto(${i})">`).join('');
  const arrows = document.querySelectorAll('.gallery-arrow');
  arrows.forEach(a => a.classList.toggle('hidden', gFotos.length <= 1));
  document.getElementById('m-titulo').textContent = c.titulo;
  document.getElementById('m-sub').textContent = c.anio + ' · ' + c.km + ' · ' + c.badge;
  const mPrecio = document.getElementById('m-precio'); if(mPrecio) mPrecio.innerHTML = c.precio + ' <small>MXN</small>';
  const badge = document.getElementById('m-badge');
  badge.textContent = c.badge;
  badge.className = 'modal-badge-luxury ' + c.cat;
  document.getElementById('m-specs').innerHTML = c.specs.map(s=>`<div class="mspec"><span class="sl">${s.l}</span><span class="sv">${s.v}</span></div>`).join('');
  document.getElementById('m-wa').href = `https://wa.me/${WA_NUM}?text=${encodeURIComponent(c.wa)}`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cerrar(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function abrirZoom(){
  document.getElementById('zoom-img').src = gFotos[gIdx];
  document.getElementById('zoom-overlay').classList.add('open');
}
function cerrarZoom(){
  document.getElementById('zoom-overlay').classList.remove('open');
}
function cambiarZoom(dir){
  gIdx = (gIdx + dir + gFotos.length) % gFotos.length;
  document.getElementById('zoom-img').src = gFotos[gIdx];
  document.querySelectorAll('.gallery-thumb').forEach((t,i) => t.classList.toggle('active', i === gIdx));
}

// Swipe táctil en modal gallery
let tsX = 0;
document.addEventListener('DOMContentLoaded', () => {
  const galeria = document.querySelector('.modal-gallery-main');
  galeria.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; }, {passive:true});
  galeria.addEventListener('touchend', e => {
    const diff = tsX - e.changedTouches[0].clientX;
    if(Math.abs(diff) > 40) cambiarFoto(diff > 0 ? 1 : -1);
  }, {passive:true});

  // Swipe táctil en zoom
  const zoom = document.getElementById('zoom-overlay');
  let tzX = 0, tzY = 0;
  zoom.addEventListener('touchstart', e => { tzX = e.touches[0].clientX; tzY = e.touches[0].clientY; }, {passive:true});
  zoom.addEventListener('touchend', e => {
    const dx = tzX - e.changedTouches[0].clientX;
    const dy = tzY - e.changedTouches[0].clientY;
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
      cambiarZoom(dx > 0 ? 1 : -1);
    } else if(Math.abs(dx) < 10 && Math.abs(dy) < 10){
      cerrarZoom();
    }
  }, {passive:true});
});

function cerrarFuera(e){
  if(e.target.id === 'overlay') cerrar();
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });

// Leer bÃºsqueda desde URL (?q=...)
const urlParams = new URLSearchParams(window.location.search);
const qParam = urlParams.get('q');
const catParam = urlParams.get('cat');
if(qParam){
  busquedaActual = qParam;
  const si = document.getElementById('search-input');
  if(si) si.value = qParam;
}
if(catParam){
  catActual = catParam;
  document.querySelectorAll('.f-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === catParam);
  });
}
renderizar();
